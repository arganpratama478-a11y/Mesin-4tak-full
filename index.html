<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulasi Mesin 4 Tak + Karbu PWK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#080808;color:#ccc;display:flex;justify-content:center;padding:8px}
.app{width:100%;max-width:500px;background:#131313;border-radius:20px;border:1px solid #222;overflow:hidden}
.hd{padding:12px 16px;background:#1a1000;border-bottom:2px solid #ff3d00;display:flex;justify-content:space-between}
.hd h1{font-size:12px;color:#ff3d00} .hd span{font-size:8px;color:#666}
canvas{width:100%;display:block;background:linear-gradient(#0e0e0e,#121212)}
.ctrls{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c{background:#1e1e1e;padding:8px;border-radius:10px} .c label{font-size:9px;color:#888;display:flex;justify-content:space-between}
input{width:100%;accent-color:#ff3d00}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 10px 10px}
.s{background:#1c1c1c;padding:6px;border-radius:8px;text-align:center;border-top:2px solid #ff3d00}
.s i{font-size:7px;color:#777;display:block;font-style:normal} .s b{font-size:11px}
.cycle{padding:0 10px 10px;display:flex;gap:4px} .cy{flex:1;padding:8px 2px;border-radius:8px;text-align:center;font-size:8px;background:#1e1e1e;color:#555;border:1px solid #222}
.cy.on{background:#ff3d00;color:#fff;box-shadow:0 0 15px #ff3d00}
#exp{margin:0 10px 12px;background:#1a1a1a;padding:10px;border-radius:10px;font-size:10px;line-height:1.6;color:#aaa;border-left:3px solid #ff3d00;min-height:70px}
</style>
</head>
<body>
<div class="app">
<div class="hd"><h1>4 TAK 150cc • KARBU PWK 28 CONNECTED</h1><span id="fps">60FPS</span></div>
<canvas id="cv" width="500" height="420"></canvas>

<div class="cycle">
<div class="cy" id="cy0">1. HISAP</div><div class="cy" id="cy1">2. KOMPRESI</div><div class="cy" id="cy2">3. USAHA</div><div class="cy" id="cy3">4. BUANG</div>
</div>

<div class="stats">
<div class="s"><i>RPM</i><b id="rpm">0</b></div><div class="s"><i>THROTTLE</i><b id="thr">0%</b></div><div class="s"><i>AFR</i><b id="afr">0</b></div><div class="s"><i>SUHU</i><b id="tmp">80°C</b></div>
</div>

<div class="ctrls">
<div class="c"><label>GAS <b id="vG">30%</b></label><input type="range" id="gas" min="0" max="100" value="30"></div>
<div class="c"><label>MAIN JET <b id="vM">120</b></label><input type="range" id="mj" min="95" max="155" value="120" step="2"></div>
</div>

<div id="exp">Memulai...</div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const gas=document.getElementById('gas'), mj=document.getElementById('mj');
let angle=0, stroke=0;

const exps=[
"1. HISAP: Piston turun 0→180°. Klep IN buka 15°. Vacuum -25kPa di venturi karbu → bensin dari main jet kesedot → campuran masuk silinder. AFR ideal 12.5-14.7",
"2. KOMPRESI: Piston naik 180→360°. Kedua klep tutup. Campuran dikompres 9.5:1 → tekanan 12bar → suhu naik 300°C. Busi siap mercik di 350°",
"3. USAHA/POWER: Busi mercik! Pembakaran 0.002 detik → tekanan 60bar dorong piston turun 360→540°. Tenaga paling gede disini. AFR boros=tenaga, AFR irit=irit tapi panas",
"4. BUANG: Piston naik 540→720°. Klep EX buka. Gas sisa 800°C dibuang lewat knalpot. Kalo klep bocor, kompresi ilang → susah hidup"
];

function draw(){
const t=gas.value/100, mJ=parseInt(mj.value);
const rpm=1000 + t*8000;
angle+= rpm/60*0.08; if(angle>720) angle-=720;
stroke=Math.floor(angle/180);

const pistonY= 60 + Math.sin(angle*Math.PI/180)*70 + 70;
const crankX=250, crankY=340;
const conRod=90;

// clear
ctx.clearRect(0,0,500,420);

// KARBU KIRI ATAS
ctx.fillStyle='#222'; ctx.fillRect(10,20,140,60);
ctx.fillStyle='#1a1a1a'; ctx.fillRect(10,35,60,30); ctx.fillRect(90,35,60,30);
ctx.fillStyle=`rgba(100,200,255,${0.3+t*0.5})`; ctx.fillRect(0,45,40,10);
ctx.fillStyle='#777'; ctx.fillRect(65, 25 + (1-t)*30, 20,40); // skep
// fuel spray
if(stroke===0){ctx.fillStyle=`rgba(255,200,0,${t})`; for(let i=0;i<10*t;i++){ctx.beginPath(); ctx.arc(90+Math.random()*30, 55+Math.random()*10,2,0,6.28); ctx.fill();}}

// INTAKE MANIFOLD
ctx.strokeStyle='#444'; ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(150,50); ctx.lineTo(190,90); ctx.stroke();
if(stroke===0){ctx.strokeStyle=`rgba(255,200,0,0.6)`; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(150,50); ctx.lineTo(190,90); ctx.stroke();}

// HEAD SILINDER
ctx.fillStyle='#2a2a2a'; ctx.fillRect(170,80,160,30);
ctx.fillStyle='#333'; ctx.fillRect(180,110,140,140); // silinder
// piston
ctx.fillStyle='#888'; ctx.fillRect(190, pistonY, 120, 35);
ctx.fillStyle='#aaa'; ctx.fillRect(195, pistonY+5,110,4); ctx.fillRect(195, pistonY+15,110,4); // ring
// klep
const inOpen= stroke===0 || stroke===3, exOpen= stroke===3;
ctx.fillStyle=inOpen?'#00ff88':'#555'; ctx.fillRect(200, 80, 10, inOpen?40:25); // IN
ctx.fillStyle=exOpen?'#ff3d00':'#555'; ctx.fillRect(290, 80, 10, exOpen?40:25); // EX
// busi
ctx.fillStyle= stroke===1 && angle%720>340 && angle%720<360 ? '#ffff00' : '#666';
ctx.beginPath(); ctx.arc(250,95,6,0,6.28); ctx.fill();
if(ctx.fillStyle==='#ffff00'){ctx.shadowColor='#ffff00'; ctx.shadowBlur=15; ctx.fill(); ctx.shadowBlur=0;}

// conrod
ctx.strokeStyle='#777'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(250, pistonY+35); ctx.lineTo(crankX+Math.sin(angle*Math.PI/180)*20, crankY+Math.cos(angle*Math.PI/180)*20); ctx.stroke();
// crankshaft
ctx.fillStyle='#444'; ctx.beginPath(); ctx.arc(crankX, crankY, 30,0,6.28); ctx.fill();
ctx.fillStyle='#ff3d00'; ctx.beginPath(); ctx.arc(crankX+Math.sin(angle*Math.PI/180)*20, crankY+Math.cos(angle*Math.PI/180)*20,8,0,6.28); ctx.fill();

// exhaust
ctx.strokeStyle='#333'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(300,90); ctx.lineTo(400,70); ctx.stroke();
if(exOpen){ctx.strokeStyle='rgba(255,80,0,0.5)'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(300,90); ctx.lineTo(400+Math.random()*20,70); ctx.stroke();}

// explosion effect
if(stroke===2 && angle%720>5 && angle%720<30){
ctx.fillStyle=`rgba(255,${100+Math.random()*100},0,${0.8-(angle%30)/30})`; ctx.beginPath(); ctx.arc(250, 160, 40-(angle%30),0,6.28); ctx.fill();
}

// UI update
document.querySelectorAll('.cy').forEach((e,i)=>e.classList.toggle('on', i===stroke));
document.getElementById('rpm').innerText=Math.floor(rpm);
document.getElementById('thr').innerText=gas.value+'%';
document.getElementById('afr').innerText=(14.7 - (mJ-120)*0.04 - t*1).toFixed(1);
document.getElementById('tmp').innerText=Math.floor(80 + rpm/100)+'°C';
document.getElementById('vG').innerText=gas.value+'%'; document.getElementById('vM').innerText=mJ;
document.getElementById('exp').innerHTML=`<b style="color:#ff3d00">LANGKAH ${stroke+1}</b><br>${exps[stroke]}`;

requestAnimationFrame(draw);
}
gas.oninput=draw; mj.oninput=draw; draw();
</script>
</body>
                           </html>
